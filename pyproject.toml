[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrgb-flowers-blooming"
version = "1.0.0"
description = "Organic floral blooming lighting engine for Redragon K556RGB-M and OpenRGB devices."
readme = "README.md"
authors = [{ name = "OpenRGB Community Contributor" }]
license = { text = "MIT" }
keywords = ["openrgb", "rgb", "keyboard", "lighting", "redragon", "k556", "solid", "dry"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.20.0",
    "openrgb-python>=0.3.5",
    "hidapi>=0.14.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "nuitka>=2.0.0",
    "zstandard>=0.20.0",
]

[project.scripts]
openrgb-flowers = "openrgb_flowers.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:anyio"

